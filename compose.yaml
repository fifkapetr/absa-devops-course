# Tredgate Loan container pilot (branch CZ-PRG-01), release 1.2.0
# gateway (nginx, 8080) -> loan-api (3000) and docs-search (3001); data on /data
services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      loan-api:
        condition: service_healthy
      docs-search:
        condition: service_healthy
    restart: unless-stopped

  loan-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    privileged: true
    mem_limit: 256m
    environment:
      DATA_FILE: /data/loans.json
      AUDIT_FILE: /data/audit.log
      METRICS_INTERVAL_MS: "60000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/loans"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  docs-search:
    build:
      context: .
      dockerfile: docker/docs.Dockerfile
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      DOCS_ADMIN_TOKEN: FAKE-docs-admin-7f3a
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
