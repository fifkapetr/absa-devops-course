# Gateway for the Tredgate Loan container pilot (branch CZ-PRG-01)
#   /       -> loan-api   (UI + API)
#   /api    -> loan-api
#   /docs   -> docs-search (handbook search)
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens on;

    # default "combined" format: client, time, full request line, status, bytes, referer, user agent
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream loan_api {
        server loan-api:3000;
    }

    upstream docs_search {
        server docs-search:3001;
    }

    server {
        listen 8080;

        location /docs/ {
            proxy_pass http://docs_search/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # reindexing the handbook can take a while on the pilot host
            proxy_read_timeout 5s;
        }

        location /api {
            proxy_pass http://loan_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://loan_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
